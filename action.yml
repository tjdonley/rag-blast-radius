name: RAG Blast Radius
description: Pre-deploy safety checks for RAG manifest changes
author: tjdonley

inputs:
  old_manifest:
    description: Path to the baseline RAG manifest.
    required: true
  new_manifest:
    description: Path to the proposed RAG manifest.
    required: true
  fail_on:
    description: >
      Exit with code 1 when risk is at least this threshold. Use none to report only;
      unassessed changes fail when any threshold is enabled.
    required: false
    default: high
  format:
    description: >
      Report format printed to logs: text, json, markdown, html, or github-output.
      The Markdown job summary and step outputs are written regardless of this value.
    required: false
    default: text
  python_version:
    description: Python version used to install and run rag-blast.
    required: false
    default: "3.12"
  pr_comment:
    description: Post or update a pull request comment with the report.
    required: false
    default: "false"
  github_token:
    description: GitHub token used when pr_comment is true.
    required: false
    default: ""

outputs:
  risk:
    description: "Top-level report risk: NONE, UNASSESSED, LOW, MEDIUM, or HIGH."
    value: ${{ steps.run.outputs.risk }}
  change_count:
    description: Number of detected manifest changes.
    value: ${{ steps.run.outputs.change_count }}
  finding_count:
    description: Number of triggered risk findings.
    value: ${{ steps.run.outputs.finding_count }}
  unassessed_change_count:
    description: Number of detected changes that no rule assessed.
    value: ${{ steps.run.outputs.unassessed_change_count }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python_version }}

    - name: Install rag-blast
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install "$GITHUB_ACTION_PATH"

    - name: Run rag-blast
      id: run
      shell: bash
      env:
        OLD_MANIFEST: ${{ inputs.old_manifest }}
        NEW_MANIFEST: ${{ inputs.new_manifest }}
        FAIL_ON: ${{ inputs.fail_on }}
        REPORT_FORMAT: ${{ inputs.format }}
        PR_COMMENT: ${{ inputs.pr_comment }}
        GH_TOKEN: ${{ inputs.github_token }}
      run: |
        set -uo pipefail

        COMMENT_MARKER='<!-- rag-blast-radius-report -->'

        REPORT_FORMAT=$(printf '%s' "$REPORT_FORMAT" | tr '[:upper:]' '[:lower:]')
        FAIL_ON=$(printf '%s' "$FAIL_ON" | tr '[:upper:]' '[:lower:]')
        PR_COMMENT=$(printf '%s' "$PR_COMMENT" | tr '[:upper:]' '[:lower:]')

        case "$REPORT_FORMAT" in
          text|json|markdown|html|github-output) ;;
          *)
            echo "::error::Unsupported report format: $REPORT_FORMAT. Use text, json, markdown, html, or github-output."
            exit 1
            ;;
        esac

        case "$FAIL_ON" in
          none|low|medium|high) ;;
          *)
            echo "::error::Unsupported fail_on threshold: $FAIL_ON. Use none, low, medium, or high."
            exit 1
            ;;
        esac

        case "$PR_COMMENT" in
          true|false) ;;
          *)
            echo "::error::Unsupported pr_comment value: $PR_COMMENT. Use true or false."
            exit 1
            ;;
        esac

        JSON_REPORT="$RUNNER_TEMP/rag-blast-report.json"
        OUTPUT_FIELDS="$RUNNER_TEMP/rag-blast-outputs.txt"

        # One check run writes the JSON report and applies the fail_on threshold.
        # Every other view of the report is re-rendered from that file.
        rag-blast check \
          --old "$OLD_MANIFEST" \
          --new "$NEW_MANIFEST" \
          --format json \
          --fail-on "$FAIL_ON" \
          --output "$JSON_REPORT"
        status=$?

        if [ ! -s "$JSON_REPORT" ]; then
          echo "::error::rag-blast did not produce a report."
          if [ "$status" -eq 0 ]; then
            exit 1
          fi
          exit "$status"
        fi

        if ! rag-blast report --input "$JSON_REPORT" --format "$REPORT_FORMAT"; then
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          echo "::error::rag-blast could not render the report."
          exit 1
        fi

        rag-blast report --input "$JSON_REPORT" --format github-output > "$OUTPUT_FIELDS"
        cat "$OUTPUT_FIELDS" >> "$GITHUB_OUTPUT"

        RISK=$(sed -n 's/^risk=//p' "$OUTPUT_FIELDS")
        FINDING_COUNT=$(sed -n 's/^finding_count=//p' "$OUTPUT_FIELDS")
        UNASSESSED_COUNT=$(sed -n 's/^unassessed_change_count=//p' "$OUTPUT_FIELDS")

        rag-blast report --input "$JSON_REPORT" --format markdown >> "$GITHUB_STEP_SUMMARY"

        if [ "$PR_COMMENT" = "true" ]; then
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::notice::pr_comment requested but github_token was not provided; skipping PR comment."
          elif [ -z "${GITHUB_EVENT_PATH:-}" ] || [ ! -f "$GITHUB_EVENT_PATH" ]; then
            echo "::notice::pr_comment requested but no GitHub event payload was available; skipping PR comment."
          else
            PR_NUMBER=$(jq -r '.pull_request.number // empty' "$GITHUB_EVENT_PATH")

            if [ -z "$PR_NUMBER" ]; then
              echo "::notice::pr_comment requested outside a pull_request event; skipping PR comment."
            elif [ -z "${GITHUB_REPOSITORY:-}" ]; then
              echo "::notice::pr_comment requested but GITHUB_REPOSITORY was unavailable; skipping PR comment."
            else
              COMMENT_BODY="$RUNNER_TEMP/rag-blast-pr-comment.md"
              COMMENT_PAYLOAD="$RUNNER_TEMP/rag-blast-pr-comment.json"
              COMMENTS_JSON="$RUNNER_TEMP/rag-blast-comments.json"

              {
                printf '%s\n\n' "$COMMENT_MARKER"
                rag-blast report --input "$JSON_REPORT" --format markdown
              } > "$COMMENT_BODY"

              jq -Rs '{body: .}' < "$COMMENT_BODY" > "$COMMENT_PAYLOAD"

              if ! gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate > "$COMMENTS_JSON"; then
                echo "::warning::Unable to fetch existing PR comments; skipping PR comment."
              else
                COMMENT_ID=$(jq -r --arg marker "$COMMENT_MARKER" \
                  '.[] | select(.body | contains($marker)) | .id' "$COMMENTS_JSON" | head -n 1)

                if [ -n "$COMMENT_ID" ]; then
                  if ! gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" --input "$COMMENT_PAYLOAD" >/dev/null; then
                    echo "::warning::Unable to update existing PR comment."
                  fi
                else
                  if ! gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --input "$COMMENT_PAYLOAD" >/dev/null; then
                    echo "::warning::Unable to create PR comment."
                  fi
                fi
              fi
            fi
          fi
        fi

        if [ "$status" -ne 0 ]; then
          echo "::error title=RAG Blast Radius blocked::risk=$RISK; fail_on=$FAIL_ON; findings=$FINDING_COUNT; unassessed_changes=$UNASSESSED_COUNT"
        fi

        exit "$status"
